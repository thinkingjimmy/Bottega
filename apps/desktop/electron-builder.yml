# [INPUT]: Depends on electron-vite output including the unpacked native Keychain policy, the electronFuses flip (RunAsNode, NODE_OPTIONS and inspect off, ad-hoc re-sign; TASK-35 slice 6), the afterPack bundled-Node step (scripts/node-runtime/after-pack.mjs), the out/system-dock native helpers and recovery LaunchAgent plist, test-receipt exclusion, the keep-node-module-types hook, root LICENSE, original sumo ISC notice, system skills, immutable Design factory payload, Base GUI SDK/toolchain/component/Starter resources, compiler native payloads, icons and the checked macOS system icon catalog, entitlements, and pinned react-grab assets, and the complete official Electron v43.1.1 75-artifact SHA256 table from SHASUMS256.txt asset 477044397
# [OUTPUT]: Produces, without npm sourcemaps (OPT-33 A) or unused App GUI dependency formats, localized diagnostics and CLI/server payloads and with only the UI languages' Chromium locale packs and configured macOS purpose locale aliases (OPT-33 B), Bottega macOS arm64 DMG (UDBZ) / ZIP (deflate -9), Windows x64 NSIS, and Linux x64 AppImage (gzip squashfs) artifacts whose packaged app.name is Bottega (own userData, never the dev directory), with the pinned Node at Resources/runtime/node/<platform>-<arch> signed with its own entitlements and the runtime manifest beside it (TASK-34), an offline fail-closed App GUI compiler, the self-contained runtime entries including plugin file/compiler programs and their runtime-entries.json unpacked beside the ASAR so a plain Node can run them (TASK-35; non-production builds also unpack the private connectivity smoke), no test-only receipt, TypeScript declaration files kept and the whole node_modules tree unpacked next to the ASAR for the packaged compiler, and no vendored Codex/Claude CLI platform packages (the product only spawns the user's own CLI), and on macOS the signed Bottega Dock helpers under Resources/system-dock/bin, the recovery agent plist under Contents/Library/LaunchAgents, and Apple Events/Downloads/Location usage descriptions with unpacked immutable official weather source/runtime; Electron downloads retain normal cache behavior and verify every selected artifact against the fixed official SHA256 table without fetching the checksum file over the network
# [POS]: The shared desktop packaging configuration; macOS uses a checked native ICNS and named system icon catalog. Release signing stays fail-closed in release scripts. The public workflow's build-only mode remains unsigned; its signed and draft modes use this Developer ID and notarization configuration.

appId: com.jimmywong.bottega
productName: Bottega
# 打包件的 Electron app.name 取自 asar 里的 package.json，而 package.json 的 name
# 是 npm 包名 @ai-chat/desktop。不注入 productName，打包件与 pnpm dev 就共用同一个
# userData 目录，两个 schema 世代会互相隔离对方的账本。只注入打包件：写进
# package.json 会连 dev 一起改名，又撞回同一个目录。
extraMetadata:
  productName: Bottega
# maximum 只改三处：DMG UDZO→UDBZ（bzip2）、mac zip -7→-9；NSIS 因差分打包强制 normal，
# 零影响。AppImage 在默认 FUSE2 toolset 下会被 maximum 自动切成 xz（冷启动每次多解压），
# 所以下面 appImage.compression 显式钉住 gzip，等 Linux 真机实测后再决定是否改 xz。
compression: maximum
# Official Electron v43.1.1 SHASUMS256.txt, asset 477044397; SHA256 a4ba61059d08db26cae5e9e61340bc15f12d6440922d76232d8b88b27e49e78a.
