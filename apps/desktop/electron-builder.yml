# OPT-33 B: only the Chromium locale packs of the UI languages (APP_LOCALES) and their region variants, so native chrome (Open/Save
# panels, menus) stays in the UI's language; each name in both styles, because mac keeps .lproj (underscore) and win/linux keep .pak (dash).
# The copied Simplified Chinese macOS purpose strings also require the exact native name zh-Hans.
# Derived and checked by config/electron-locale.test.mjs.
electronLanguages:
  - en-US
  - en_US
  - en-GB
  - en_GB
  - zh-CN
  - zh_CN
  - zh-Hans
  - zh-TW
  - zh_TW
  - ja
  - fr
  - es
  - es-419
  - es_419
directories:
  output: release
files:
  - out/**
  - "!out/.e2e-build-receipt.json"
  - "!out/renderer/.chart-module-report.json"
  # 两个 ACP adapter 的依赖链各带一份平台 CLI 原生二进制（codex 271 MB、claude 257 MB）。
  # 产品只 spawn 用户本机 CLI（CODEX_PATH / CLAUDE_CODE_EXECUTABLE），它们从未被执行。
  # 负模式作用于 electron-builder 收集后的 node_modules 相对路径；`**/` 同时覆盖嵌套放置。
  - "!**/node_modules/@openai/codex-*/**"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # OPT-33 A: npm sourcemaps (about 2,600 files, 70 MB raw) are never read at run time; our own bundles emit none, and the npm ones are
  # reproducible from the lockfile, so no private copy is kept.
  - "!**/node_modules/**/*.map"
  # Keep compiler-observed entries and declarations; exclude only unused alternatives.
  - "!**/node_modules/@phosphor-icons/react/dist/ssr/**"
  - "!**/node_modules/@phosphor-icons/react/dist/index.umd.js"
  - "!**/node_modules/@phosphor-icons/react/dist/index.cjs.js"
  - "!**/node_modules/echarts/dist/echarts*.js"
  - "!**/node_modules/typescript/lib/_tsc.js"
  - "!**/node_modules/typescript/lib/*/diagnosticMessages.generated.json"
  - "!**/node_modules/typescript/lib/_tsserver.js"
  - "!**/node_modules/typescript/lib/_typingsInstaller.js"
  - "!**/node_modules/typescript/lib/tsserver.js"
  - "!**/node_modules/typescript/lib/tsserverlibrary.js"
  - "!**/node_modules/typescript/lib/typingsInstaller.js"
  - "!**/node_modules/typescript/lib/watchGuard.js"
  - "!**/node_modules/lucide-react/dist/lucide-react.prefixed.d.ts"
  - "!**/node_modules/lucide-react/dist/lucide-react.suffixed.d.ts"
# electron-builder 默认把 node_modules 里的 *.d.ts 全部剔除。打包态 App GUI 编译器要在 asar 内
# 对作者源码做 typecheck（typescript/lib 与各包声明），没有它们每次打包态编译都死在
# "Cannot find global type 'Array'"——首个打包态编译 smoke（2026-09-04）暴露的第三个死点。
onNodeModuleFile: ./scripts/keep-node-module-types.cjs
# TASK-34: the pinned, signature-verified Node goes to Resources/runtime with its own signature and the runtime manifest.
# A hook, not an extraResources entry, so every packaging path (including the public workflow) runs it and fails closed.
afterPack: ./scripts/node-runtime/after-pack.mjs
# TASK-35 slice 6: flipped by electron-builder after afterPack and before signing. Every Node program runs on the bundled Node, so the
# app itself never runs as Node, reads NODE_OPTIONS or takes --inspect. resetAdHocDarwinSignature: a package built without an identity
# (dist:verify, staging) would not launch on arm64 after the flip; a Developer ID build signs over it afterwards.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  resetAdHocDarwinSignature: true
# 整个 node_modules 以 unpacked 形式落盘：打包态 App GUI 编译器把 require.resolve 得到的
# 依赖路径交给原生 esbuild 子进程，而 esbuild 读不到 app.asar 里的虚拟路径——首个打包态
# 编译 smoke（2026-09-04）暴露的第四个死点。unpack 不改变字节数：asar 头仍列出全部条目、
# Node 侧读取透明，只是文件真身放在 app.asar.unpacked 下，esbuild/Oxide 原生载荷随之覆盖。
asarUnpack:
  - node_modules/**
  - "out/main/{keychain-policy,weather-location}.node"
  # Immutable plugin admission compares real file identities before copying verified bytes.
  - "out/main/official-plugins/**"
  # TASK-35: the entries a plain Node runs cannot live inside the asar; each is self-contained and digest-checked (runtime-entries.json).
  - "out/main/{package-host-entry,plugin-files-entry,plugin-compiler-entry,package-provider-entry,custody-guardian-entry,builtin-tools-server,codec-host-entry,app-gui-compiler-entry,process-watchdog-entry,seatbelt-measurement-entry,repair-supervisor-entry,palette-validator-entry}.js"
  # TASK-35 slice 6: the digests beside them, so a plain Node can compose the packaged port; and the private connectivity smoke, which
  # exists only in non-production builds (the pattern then matches nothing), run by the dist smoke on the bundled Node.
  - "out/main/runtime-entries.json"
extraResources:
  - from: resources/presence
    to: presence
    filter: ["*.png"]
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../packages/cloud-crypto/NOTICE.txt
    to: licenses/libsodium-0.8.4.txt
  - from: resources/icon.png
    to: icon.png
  - from: resources/skills
    to: skills
  - from: resources/gui-sdk
    to: gui-sdk
  - from: resources/app-gui-toolchain
    to: app-gui-toolchain
  - from: resources/app-gui-starters
    to: app-gui-starters
  - from: resources/app-gui-components
    to: app-gui-components
  # The extension signing anchor (TASK-14 S7): unprovisioned until the key ceremony; a packaged build never takes a test anchor.
  - from: resources/extension-trust
    to: extension-trust
  - from: node_modules/react-grab/dist/index.global.js
    to: react-grab/index.global.js
  - from: node_modules/react-grab/dist/styles.css
    to: react-grab/styles.css
mac:
  binaries:
    - Contents/Resources/tunnel/bin/preview-capture
    - Contents/Resources/system-dock/bin/system-dock-bridge
    - Contents/Resources/system-dock/bin/bottega-dock-recovery
    - Contents/Resources/system-dock/bin/dock-glass.node
  # Bottega Dock (macOS 15+, arm64) ships only in mac packages; mac extraFiles are rooted at Contents/.
  # SMAppService.agent(plistName:) only looks in Contents/Library/LaunchAgents.
  extraFiles:
    - from: resources/location
      to: Resources
      filter: ["**/InfoPlist.strings"]
    - from: resources/macos-icon/Assets.car
      to: Resources/Assets.car
    - from: out/tunnel/bin
      to: Resources/tunnel/bin
      filter: ["preview-capture"]
    - from: out/system-dock/bin
      to: Resources/system-dock/bin
      filter: ["system-dock-bridge", "bottega-dock-recovery", "dock-glass.node"]
    - from: out/system-dock/LaunchAgents
      to: Library/LaunchAgents
      filter: ["*.dock-recovery.plist"]
  # TCC prompts and attribution belong to the outer app: Finder Automation (empty Trash) and Downloads reads.
  extendInfo:
    CFBundleIconName: Bottega
    NSAppleEventsUsageDescription: Bottega asks Finder to empty the Trash only when you confirm it from the Bottega Dock.
    NSLocationUsageDescription: Bottega uses your location to show current weather when you choose the Weather Widget.
    NSLocationWhenInUseUsageDescription: Bottega uses your location to show current weather when you choose the Weather Widget.
    NSDownloadsFolderUsageDescription: Bottega shows your most recent downloads in the Bottega Dock so you can open them quickly.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  notarize: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # The bundled Node is signed in afterPack with resources/entitlements.node.plist; the app-wide pass must not re-sign it.
  signIgnore:
    - "/Contents/Resources/runtime/node/[^/]+/bin/node$"
  icon: resources/icon.icns
win:
