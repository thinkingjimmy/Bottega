# [INPUT]: Depends on electron-vite output, test-receipt exclusion, root LICENSE, system skills, immutable Design factory payload, Base GUI SDK/toolchain/component/Starter resources, compiler native payloads, icons, entitlements, and pinned react-grab assets
# [OUTPUT]: Produces Bottega macOS arm64 DMG/ZIP, Windows x64 NSIS, and Linux x64 AppImage artifacts with an offline fail-closed App GUI compiler and no test-only receipt
# [POS]: The only desktop packaging configuration; release signing is fail-closed in release scripts while ordinary CI packaging remains unsigned

appId: com.jimmywong.bottega
productName: Bottega
directories:
  output: release
files:
  - out/**
  - "!out/.e2e-build-receipt.json"
  - "!out/renderer/.chart-module-report.json"
asarUnpack:
  - node_modules/@esbuild/**
  - node_modules/@tailwindcss/oxide*/**
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: resources/icon.png
    to: icon.png
  - from: resources/skills
    to: skills
  - from: resources/apps/Bottega-app-design-canvas
    to: factory-apps/design-canvas
  - from: resources/gui-sdk
    to: gui-sdk
  - from: resources/app-gui-toolchain
    to: app-gui-toolchain
  - from: resources/app-gui-starters
    to: app-gui-starters
  - from: resources/app-gui-components
    to: app-gui-components
  - from: node_modules/react-grab/dist/index.global.js
    to: react-grab/index.global.js
  - from: node_modules/react-grab/dist/styles.css
    to: react-grab/styles.css
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  notarize: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  icon: resources/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: resources/icon.png
  category: Utility
  executableName: bottega
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: thinkingjimmy
  repo: Bottega
