<!doctype html>
<!--
[INPUT]: Browser HTML/CSS/JS with no external dependencies
[OUTPUT]: Executable offline design method example
[POS]: Artifact design task example; adapt to the current brief
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard example</title><style>body{margin:0;font:16px/1.5 system-ui;color:#172c27;background:#f5f4ee}main{max-width:960px;margin:auto;padding:32px}button{min-height:44px;padding:8px 20px;background:#225c4d;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}button:hover{background:#174336}button:focus-visible{outline:3px solid #a45820;outline-offset:3px}h1{font-size:clamp(28px,5vw,48px);line-height:1.15}select{min-height:44px;font:inherit}</style></head><body><main><h1>Project activity</h1><p>Example records; no live data is connected.</p><label for="filter">Filter by status </label><select id="filter"><option value="all">All</option><option value="active">Active</option></select><ul id="records"><li data-status="active">Research — Active</li><li data-status="done">Scope — Done</li></ul></main><script>document.getElementById('filter').addEventListener('change',event=>document.querySelectorAll('[data-status]').forEach(row=>row.hidden=event.target.value!=='all'&&row.dataset.status!==event.target.value))</script></body></html>
