<!doctype html>
<!--
[INPUT]: Browser HTML/CSS/JS with no external dependencies
[OUTPUT]: Executable offline design method example
[POS]: Artifact design task example; adapt to the current brief
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing example</title><style>body{margin:0;font:16px/1.5 system-ui;color:#172c27;background:#f5f4ee}main{max-width:960px;margin:auto;padding:32px}button{min-height:44px;padding:8px 20px;background:#225c4d;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}button:hover{background:#174336}button:focus-visible{outline:3px solid #a45820;outline-offset:3px}h1{font-size:clamp(28px,5vw,48px);line-height:1.15}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:24px}article{border:1px solid #89988e;border-radius:12px;padding:24px}</style></head><body><main><h1>Choose your workspace</h1><p>Example prices are placeholders.</p><section class="plans"><article><h2>Individual</h2><p>[PRICE] per month</p><button data-plan="Individual">Choose Individual</button></article><article><h2>Team</h2><p>[PRICE] per member</p><button data-plan="Team">Choose Team</button></article></section><p id="choice" role="status"></p></main><script>document.querySelectorAll('[data-plan]').forEach(button=>button.addEventListener('click',()=>document.getElementById('choice').textContent=button.dataset.plan+' selected in this prototype.'))</script></body></html>
