packages:
  - apps/desktop
  - packages/*
  # The public SDK packages (TASK-14), one level down.
  - packages/sdk/*
  # Standalone Expo shell with its own lockfile (mobile PRD §5.1).

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  # Mermaid only consumes marked's paragraph/inline lexer; list-renderer changes in 17 do not affect it.
  'mermaid>marked': 17.0.6
  # Sankey consumes max/min/sum and linkHorizontal; verified against the shared D3 7 geometry runtime.
  'd3-sankey>d3-array': 3.2.4
  'd3-sankey>d3-shape': 3.2.0
  # Share the Claude adapter's Zod runtime with the main process and worker isolates.
  '@agentclientprotocol/claude-agent-acp>zod': 4.6.4

minimumReleaseAgeExclude:
  - react-hook-form@7.87.0
  - konva@10.5.0
  - react-konva@19.2.7
  - zod@4.6.4

patchedDependencies:
  '@electron/osx-sign@1.3.3': patches/packaging/@electron__osx-sign@1.3.3.patch
  '@streamdown/cjk@1.0.3': patches/@streamdown__cjk@1.0.3.patch
  '@streamdown/code@1.1.1': patches/@streamdown__code@1.1.1.patch
  '@streamdown/math@1.0.2': patches/@streamdown__math@1.0.2.patch
  '@streamdown/mermaid@1.0.2': patches/@streamdown__mermaid@1.0.2.patch
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
  remend@1.3.0: patches/remend@1.3.0.patch
  streamdown@2.5.0: patches/streamdown@2.5.0.patch
  use-stick-to-bottom@1.1.6: packages/ui/patches/use-stick-to-bottom@1.1.6.patch
